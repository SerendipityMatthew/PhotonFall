<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMOS 技术时间线 · PhotonFall</title>
<meta name="description" content="CMOS 图像传感器的每项关键技术，最先在手机、安防/汽车、工业还是相机上量产？2000–2026 时间线。">
<style>
:root{--bg:#0d1420;--bg2:#162033;--ink:#e6ebf4;--dim:#9aa6bb;--line:rgba(230,235,244,.14);
  --phone:#5a95ff;--auto:#ef5a5f;--ind:#36c47f;--cam:#e3a33a;--accent:#f0a487;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif SC",Georgia,serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#1d2a44 0%,var(--bg) 55%) fixed,var(--bg);color:var(--ink);font:15px/1.6 var(--sans);overflow-x:hidden}
a{color:inherit}
#bar{position:fixed;z-index:20;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--phone),var(--auto),var(--ind),var(--cam))}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(13,20,32,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header a,header button{border:1px solid var(--line);border-radius:999px;background:rgba(22,32,51,.7);color:var(--ink);font:500 13px/1 var(--sans);padding:9px 14px;text-decoration:none;cursor:pointer}
header a:hover,header button:hover{border-color:var(--accent)}
header .sp{flex:1}
.hero{max-width:860px;margin:0 auto;padding:clamp(40px,9vh,96px) 16px 24px;text-align:center}
.eye{margin:0 0 12px;font:600 12px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font:800 clamp(34px,7vw,68px)/1.08 var(--sans);letter-spacing:-.02em;background:linear-gradient(100deg,#ffe9c7,#f0a487 40%,#a9d4ff 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:620px;margin:18px auto 0;color:var(--dim)}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:30px 0 0;padding:0;list-style:none}
.stats button{min-width:132px;border:1.5px solid var(--c);border-radius:14px;background:rgba(22,32,51,.6);color:var(--ink);padding:12px 14px;cursor:pointer;font:inherit;transition:opacity .2s,transform .2s,background .2s}
.stats button:hover{transform:translateY(-2px)}
.stats button[aria-pressed=false]{opacity:.35}
.stats b{display:block;font:800 30px/1 var(--mono);color:var(--c)}
.stats span{font-size:13px;color:var(--dim)}
.hint{margin:12px 0 0;font-size:12px;color:var(--dim)}
.legend{display:flex;justify-content:center;gap:16px;margin:10px 0 0;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--dim)}
.legend .solid i{background:var(--dim)}

/* 时间线主体 */
.tl{position:relative;max-width:980px;margin:24px auto 0;padding:20px 16px 80px;list-style:none}
.tl::before,.tl .fill{content:"";position:absolute;top:0;left:50%;width:3px;margin-left:-1.5px;border-radius:3px}
.tl::before{bottom:0;background:var(--line)}
.tl .fill{height:0;background:linear-gradient(180deg,var(--cam),var(--auto),var(--ind),var(--phone));box-shadow:0 0 14px rgba(240,164,135,.5)}
.yr{position:relative;display:flex;justify-content:center;margin:34px 0 14px}
.yr span{position:relative;z-index:1;padding:6px 16px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font:800 20px/1 var(--mono);letter-spacing:.04em;box-shadow:0 0 0 6px var(--bg)}
.it{position:relative;width:50%;padding:8px 34px 8px 0}
.it.r{margin-left:50%;padding:8px 0 8px 34px}
.it::after{content:"";position:absolute;top:26px;right:-8px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--c);box-shadow:0 0 12px var(--c)}
.it.r::after{right:auto;left:-8px}
.it.first::after{background:var(--c)}
.card{position:relative;padding:14px 16px;border-radius:14px;background:linear-gradient(180deg,rgba(28,40,62,.92),rgba(20,30,48,.92));border:1px solid var(--line);border-top:3px solid var(--c);box-shadow:0 10px 30px rgba(0,0,0,.25);
  opacity:0;transform:translateY(24px) scale(.98);transition:opacity .6s ease,transform .6s ease}
.it.in .card{opacity:1;transform:none}
.card::before{content:"";position:absolute;top:24px;right:-8px;width:14px;height:14px;background:inherit;border-right:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.it.r .card::before{right:auto;left:-8px;transform:rotate(-135deg)}
.tag{display:inline-flex;gap:6px;align-items:center;font:600 11px/1 var(--sans);letter-spacing:.04em}
.tag em{font-style:normal;padding:4px 8px;border-radius:999px;background:var(--c);color:#0d1420}
.tag .flw{background:transparent;border:1px solid var(--c);color:var(--c)}
.card h3{margin:10px 0 2px;font:700 18px/1.3 var(--sans)}
.card .prod{margin:0;font:500 13px/1.4 var(--mono);color:var(--c)}
.card p.d{margin:8px 0 0;font-size:14px;color:var(--dim)}
.card .to{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;font-size:12px;color:var(--dim);align-items:center}
.card .to a{padding:3px 9px;border-radius:999px;border:1px solid var(--cc);color:var(--cc);text-decoration:none}
.card .to a:hover{background:var(--cc);color:#0d1420}
.it.off{display:none}
.it.flash .card{box-shadow:0 0 0 2px var(--c),0 10px 30px rgba(0,0,0,.25)}
footer{max-width:860px;margin:0 auto;padding:0 16px 60px;text-align:center;font-size:13px;color:var(--dim)}

@media (max-width:720px){
  .tl::before,.tl .fill{left:24px}
  .it,.it.r{width:auto;margin-left:0;padding:8px 0 8px 52px}
  .it::after,.it.r::after{left:16px;right:auto}
  .card::before,.it.r .card::before{right:auto;left:-8px;transform:rotate(-135deg)}
  .yr{justify-content:flex-start}
  .yr span{margin-left:0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div id="bar" aria-hidden="true"></div>
<header>
  <a href="index.html#/" id="home">⌂ PhotonFall</a>
  <a href="index.html#/step/21" id="step21"></a>
  <span class="sp"></span>
  <button type="button" id="lang"></button>
</header>
<section class="hero">
  <p class="eye">CMOS Image Sensor · 2000–2026</p>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <ul class="stats" id="stats"></ul>
  <p class="hint" id="hint"></p>
  <p class="legend" id="legend"></p>
</section>
<ol class="tl" id="tl"><li class="fill" aria-hidden="true"></li></ol>
<footer id="foot"></footer>

<script src="js/i18n.js"></script>
<script src="js/cmostl.js"></script>
<script src="js/cmos-timeline-page.js"></script>
</body>
</html>
